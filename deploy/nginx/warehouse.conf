# Вставити в блок http {} файлу rubin_wine/nginx/nginx.conf.
# Лише ПІСЛЯ отримання сертифіката: без його файлів nginx не запуститься,
# і зупиняться всі сайти хоста. Див. кроки 7-8 у deploy/DEPLOY_RUBIN_HOST.md.
    server {
        listen 80;
        server_name warehouse.mom www.warehouse.mom;
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name warehouse.mom www.warehouse.mom;

        ssl_certificate /etc/letsencrypt/live/warehouse.mom/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/warehouse.mom/privkey.pem;

        client_max_body_size 50M;
        proxy_read_timeout 120s;

        location / {
            set $backend "vehicle-ui:8080";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://$backend;
        }
    }
